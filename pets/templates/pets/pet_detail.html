{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white shadow-lg rounded-lg mt-10">
    <!-- Pet Photo and Header -->
    <div class="flex items-center justify-between border-b pb-4 mb-4">
        <div class="flex items-center">
            {% if pet.photo %}
            <img src="{{ pet.photo.url }}" alt="{{ pet.name }}" 
                 class="w-32 h-32 object-cover rounded-full border-4 border-blue-300 shadow-md">
            {% endif %}
            <div class="ml-6">
                <h1 class="text-4xl font-bold text-blue-600">{{ pet.name }}</h1>
                <p class="text-lg text-gray-500">Species: {{ pet.species }}</p>
            </div>
        </div>
        <a href="{% url 'pet_list' %}" 
           class="text-blue-500 hover:text-blue-700 font-semibold">
            &larr; Back to Pet List
        </a>
    </div>

    <!-- Pet Details -->
    <div class="space-y-4">
        <p class="text-lg"><strong class="text-gray-700">Breed:</strong> {{ pet.breed }}</p>
        <p class="text-lg"><strong class="text-gray-700">Birth Date:</strong> {{ pet.birth_date }}</p>
    </div>

    <!-- CTA Section -->
    <div class="mt-6 text-center">
        <button class="bg-blue-500 text-white px-6 py-2 rounded-lg shadow-md hover:bg-blue-600 transition">
            Edit Details
        </button>
    </div>
</div>
{% endblock %}
