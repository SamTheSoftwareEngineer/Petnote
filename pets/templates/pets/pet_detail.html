<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pet.name }}</title>
</head>
<body>
    {% if pet.photo %}
    <img src="{{ pet.photo.url }}" alt="{{ pet.name }}">
    {% endif %}
    <h1>{{ pet.name }}</h1>
    <p>Species: {{ pet.species }}</p>
    <p>Breed: {{ pet.breed }}</p>
    <p>Birth Date: {{ pet.birth_date }}</p>
    <a href="{% url 'pet_list' %}">Back to Pet List</a>
</body>
</html>
