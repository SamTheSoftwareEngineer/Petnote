{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Petnote{% endblock %}</title>
    {% tailwind_css %}
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-500 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">
                <a href="{% url 'pet_list' %}">Petnote</a>
            </h1>
            <nav>
                <div>
                    {% if user.is_authenticated %}
                        <span class="mr-4">Welcome, {{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-white hover:underline bg-transparent border-0 cursor-pointer">
                                Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="mr-4 text-white hover:underline">Login</a>
                        <a href="{% url 'signup' %}" class="text-white hover:underline">Sign Up</a>
                    {% endif %}
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4">
        <div class="container mx-auto text-center">
            <p>&copy; 2024 Petnote</p>
        </div>
    </footer>
</body>
</html>
