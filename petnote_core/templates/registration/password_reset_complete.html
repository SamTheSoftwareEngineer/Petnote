{% extends "base.html" %}

{% block title %} Password Reset Complete {% endblock title %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded shadow-lg max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-4">Password Reset Successful</h1>
        <p class="text-gray-700">
            Your password has been reset successfully. You can now log in with your new password.
        </p>
        <a href="{% url 'login' %}" class="block mt-6 text-blue-500 hover:underline">Return to Login</a>
    </div>
</div>
{% endblock %}
