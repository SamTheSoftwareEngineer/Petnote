{% extends "base.html" %}

{% block title %} Password Reset Sent {% endblock title %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded shadow-lg max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-4">Email Sent</h1>
        <p class="text-gray-700">
            We’ve emailed you instructions for resetting your password. If you don’t receive an email, please check your spam folder.
        </p>
        <a href="{% url 'login' %}" class="block mt-6 text-blue-500 hover:underline">Return to Login</a>
    </div>
</div>
{% endblock %}
