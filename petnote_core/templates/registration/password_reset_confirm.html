{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-semibold mb-4">Set a New Password</h2>
    {% if validlink %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded mt-2">Change Password</button>
        </form>
    {% else %}
        <p class="text-red-500">The reset link is invalid or has expired.</p>
    {% endif %}
</div>
{% endblock %}
