{% extends 'base.html' %}
{% load socialaccount %}
{% block content %}

<div class="max-w-md mx-auto mt-10 p-8 bg-white shadow-lg rounded-lg">
    <h1 class="text-2xl font-bold text-blue-600 mb-6 text-center">Create an Account</h1>
    
    <form method="post" class="space-y-4" action="{% url 'account_signup' %}">
        {% csrf_token %}

        <div>
            <label for="id_first_name" class="block text-gray-700 font-medium mb-2">First Name:</label>
            <input type="text" name="first_name" id="id_first_name" class="w-full p-2 border rounded-lg" required>
        </div>

        <div>
            <label for="id_last_name" class="block text-gray-700 font-medium mb-2">Last Name:</label>
            <input type="text" name="last_name" id="id_last_name" class="w-full p-2 border rounded-lg" required>
        </div>
        
        <div>
            <label for="id_email" class="block text-gray-700 font-medium mb-2">Email:</label>
            <input type="email" name="email" id="id_email" class="w-full p-2 border rounded-lg" required>
        </div>
        
        <div>
            <label for="id_password1" class="block text-gray-700 font-medium mb-2">Password</label>
            <input type="password" name="password1" id="id_password1" class="w-full p-2 border rounded-lg" required>
        </div>
        
        <div>
            <label for="id_password2" class="block text-gray-700 font-medium mb-2">Confirm Password</label>
            <input type="password" name="password2" id="id_password2" class="w-full p-2 border rounded-lg" required>
        </div>

        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
            Sign up
        </button>

    <p class="mt-4 text-center text-gray-600">
        Already have an account? 
        <a href="{% url 'account_login' %}" class="text-blue-500 hover:underline">Log in</a>
    </p>
</div>

{% endblock %}
