<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Link Invalid or Expired</title>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-lg w-full">
            <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Email Verification</h2>

            <div class="bg-red-100 border-l-4 border-red-500 p-4 text-red-700 mb-6">
                <p class="font-medium">{{ error_message }}</p>
            </div>

            <p class="text-center text-gray-600 mb-4">If you believe this is an error, you can request a new verification email.</p>

            <div class="text-center">
                <a href="{% url 'signup' %}" class="inline-block bg-blue-500 text-white px-6 py-3 rounded-md text-lg font-semibold hover:bg-blue-600 transition duration-300">
                    Request New Verification Email
                </a>
            </div>
        </div>
    </div>

</body>
</html>
