{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Petnote{% endblock %}</title>
    {% tailwind_css %}
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .fade-in {
            animation: fadeIn 2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 flex items-center justify-center h-screen">
    <div class="text-center fade-in">
        <!-- Petnote Logo -->
        <img src="{% static 'images/Petnote Logo - No BG.png' %}" alt="Petnote Logo" class="mx-auto w-80 h-80 mb-3">

        <!-- Welcome Text -->
        <h1 class="text-3xl font-bold mb-4">Welcome to Petnote!</h1>
        <p class="text-lg text-gray-700 mb-6">We're so glad you're here.</p>

        <!-- Buttons -->
        <div class="space-x-4">
            <a href="{% url 'login' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Login
            </a>
            <a href="{% url 'signup' %}" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Register
            </a>
        </div>
        <!-- Forgot Password -->
        {% comment %} <div class="mt-4">
            <a href="{% url 'password_reset' %}" class="text-blue-500 hover:text-blue-600">
                Forgot your password?
            </a>
        </div> {% endcomment %}
    </div>
</body>
</html>
