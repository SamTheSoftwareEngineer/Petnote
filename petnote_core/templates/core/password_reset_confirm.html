{% extends "base.html" %}

{% block title %} Set a New Password {% endblock title %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold mb-4 text-center">Set a New Password</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button 
                type="submit" 
                class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
                Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
