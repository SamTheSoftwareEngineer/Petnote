version: '3.9'

services:
  web:
    build:
      context: .
    container_name: petnote_web
    command: >
      sh -c "python wait_for_postgres.py && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: petnote_db
    environment:
      POSTGRES_USER: samairastewart
      POSTGRES_PASSWORD: 114836960
      POSTGRES_DB: petnote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
