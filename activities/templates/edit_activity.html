{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Edit Activity</h1>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded">
      Update
    </button>
    <a href="{% url 'pet_detail' activity.pet.id %}" class="bg-gray-500 text-white py-2 px-4 rounded">Cancel</a>
  </form>
</div>
{% endblock %}
